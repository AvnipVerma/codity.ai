# Rules for the codity scanner. Rules are data: add a vulnerability class by
# adding an entry here. See README.md ("Writing rules") for the full schema.
#
# Pattern syntax: dotted paths, `*` matches exactly one segment. `*.execute`
# also matches method calls on receivers whose type is unknown (`cur.execute`).
# Single-segment builtin names (`open`, `eval`) mean `builtins.<name>`.
#
# Source groups are defined once with YAML anchors (&name) in the first rule
# and reused (*name) by the others.
#
# Source choices (precision trade-off, see DECISIONS.md):
#   * Web request data (Flask, Django, DRF, aiohttp, Starlette/FastAPI request
#     objects) is untrusted for every rule.
#   * input()/sys.argv are untrusted for SQL, command, path and deserialization
#     rules, but not for SSRF/XSS (CLI tools fetch URLs they are given).
#   * Environment variables are untrusted only for SQL and command injection;
#     for file paths and URLs they are almost always operator configuration.

rules:
  - id: py.sql-injection
    severity: critical
    cwe: CWE-89
    message: "Untrusted input reaches a SQL query without parameterization"
    kind: taint
    precision: high
    help: >-
      Pass user data as query parameters (cursor.execute("... WHERE id = %s", (value,)))
      instead of formatting it into the SQL string.
    sources:
      # Flask's global request object. MultiDict getters are not sources when
      # werkzeug converts the value: request.args.get('page', type=int).
      - patterns: &flask_getters [flask.request.args.get, flask.request.args.getlist,
                                  flask.request.form.*, flask.request.values.*]
        when: &not_converted {kwarg: type, not_in: [int, float, bool]}
      - patterns: &flask_request [flask.request.args, flask.request.form, flask.request.values,
                                  flask.request.json, flask.request.get_json, flask.request.data,
                                  flask.request.get_data, flask.request.stream,
                                  flask.request.cookies, flask.request.cookies.*,
                                  flask.request.headers, flask.request.headers.*,
                                  flask.request.files, flask.request.files.*,
                                  flask.request.view_args, flask.request.view_args.*,
                                  flask.request.url, flask.request.base_url, flask.request.full_path,
                                  flask.request.path, flask.request.query_string,
                                  flask.request.referrer, flask.request.user_agent]
      # Request objects that frameworks pass to views as a parameter. See
      # typed_parameters below; annotated parameters (request: HttpRequest) are
      # typed from their annotation.
      - patterns: &framework_requests [
          django.http.HttpRequest.GET, django.http.HttpRequest.GET.*,
          django.http.HttpRequest.POST, django.http.HttpRequest.POST.*,
          django.http.HttpRequest.COOKIES, django.http.HttpRequest.COOKIES.*,
          django.http.HttpRequest.FILES, django.http.HttpRequest.FILES.*,
          django.http.HttpRequest.META, django.http.HttpRequest.META.*,
          django.http.HttpRequest.headers, django.http.HttpRequest.headers.*,
          django.http.HttpRequest.body, django.http.HttpRequest.path,
          django.http.HttpRequest.path_info, django.http.HttpRequest.get_full_path,
          rest_framework.request.Request.data, rest_framework.request.Request.data.*,
          rest_framework.request.Request.query_params, rest_framework.request.Request.query_params.*,
          rest_framework.request.Request.GET, rest_framework.request.Request.GET.*,
          rest_framework.request.Request.POST, rest_framework.request.Request.POST.*,
          rest_framework.request.Request.COOKIES, rest_framework.request.Request.COOKIES.*,
          rest_framework.request.Request.FILES, rest_framework.request.Request.FILES.*,
          rest_framework.request.Request.headers, rest_framework.request.Request.headers.*,
          aiohttp.web.Request.query, aiohttp.web.Request.query.*,
          aiohttp.web.Request.match_info, aiohttp.web.Request.match_info.*,
          aiohttp.web.Request.headers, aiohttp.web.Request.headers.*,
          aiohttp.web.Request.cookies, aiohttp.web.Request.cookies.*,
          aiohttp.web.Request.post, aiohttp.web.Request.json, aiohttp.web.Request.text,
          aiohttp.web.Request.read, aiohttp.web.Request.rel_url, aiohttp.web.Request.path,
          fastapi.Request.query_params, fastapi.Request.query_params.*,
          fastapi.Request.path_params, fastapi.Request.path_params.*,
          fastapi.Request.headers, fastapi.Request.headers.*,
          fastapi.Request.cookies, fastapi.Request.cookies.*,
          fastapi.Request.json, fastapi.Request.form, fastapi.Request.body,
          starlette.requests.Request.query_params, starlette.requests.Request.query_params.*,
          starlette.requests.Request.path_params, starlette.requests.Request.path_params.*,
          starlette.requests.Request.headers, starlette.requests.Request.headers.*,
          starlette.requests.Request.cookies, starlette.requests.Request.cookies.*,
          starlette.requests.Request.json, starlette.requests.Request.form,
          starlette.requests.Request.body]
      # Process input
      - patterns: &cli_input [builtins.input, sys.argv]
      - patterns: &environment [os.environ, os.environ.get, os.getenv]
    typed_parameters: &framework_parameters
      # first match wins: a DRF module also imports django
      - {name: request, type: rest_framework.request.Request, module_imports: [rest_framework]}
      - {name: request, type: django.http.HttpRequest, module_imports: [django]}
      - {name: request, type: aiohttp.web.Request, module_imports: [aiohttp]}
    sinks:
      - {pattern: "*.execute", arg: 0, kwarg: [sql, query, statement, operation]}
      - {pattern: "*.executemany", arg: 0}
      - {pattern: "*.executescript", arg: 0}
      - {pattern: "*.exec_driver_sql", arg: 0}
      - {pattern: sqlalchemy.text, arg: 0}
      - {pattern: sqlalchemy.sql.text, arg: 0}
      - {pattern: sqlalchemy.sql.expression.text, arg: 0}
      - {pattern: "*.raw", arg: 0}
      - {pattern: "*.extra", arg: any}
      - {pattern: pandas.read_sql, arg: 0, kwarg: sql}
      - {pattern: pandas.read_sql_query, arg: 0, kwarg: sql}
    sanitizers:
      - patterns: [builtins.int, builtins.float, builtins.bool, uuid.UUID, myapp.db.quote_identifier,
                   psycopg2.sql.Identifier, psycopg2.sql.Literal]

  - id: py.command-injection
    severity: critical
    cwe: CWE-78
    message: "Untrusted input reaches a shell command or code evaluation"
    kind: taint
    precision: high
    help: >-
      Pass arguments as a list without shell=True (subprocess.run(["ls", path])), or
      quote them with shlex.quote(). Never eval/exec user data.
    sources:
      - {patterns: *flask_getters, when: *not_converted}
      - patterns: *flask_request
      - patterns: *framework_requests
      - patterns: *cli_input
      - patterns: *environment
    typed_parameters: *framework_parameters
    sinks:
      - {pattern: os.system, arg: 0, kwarg: command}
      - {pattern: os.popen, arg: 0, kwarg: cmd}
      - {pattern: subprocess.run, arg: 0, kwarg: args, when: {kwarg: shell, is_true: true}}
      - {pattern: subprocess.call, arg: 0, kwarg: args, when: {kwarg: shell, is_true: true}}
      - {pattern: subprocess.check_call, arg: 0, kwarg: args, when: {kwarg: shell, is_true: true}}
      - {pattern: subprocess.check_output, arg: 0, kwarg: args, when: {kwarg: shell, is_true: true}}
      - {pattern: subprocess.Popen, arg: 0, kwarg: args, when: {kwarg: shell, is_true: true}}
      - {pattern: subprocess.getoutput, arg: 0, kwarg: cmd}
      - {pattern: subprocess.getstatusoutput, arg: 0, kwarg: cmd}
      - {pattern: asyncio.create_subprocess_shell, arg: 0, kwarg: cmd}
      - {pattern: os.execl, arg: any}
      - {pattern: os.execle, arg: any}
      - {pattern: os.execlp, arg: any}
      - {pattern: os.execlpe, arg: any}
      - {pattern: os.execv, arg: any}
      - {pattern: os.execve, arg: any}
      - {pattern: os.execvp, arg: any}
      - {pattern: os.execvpe, arg: any}
      - {pattern: os.spawnl, arg: any}
      - {pattern: os.spawnlp, arg: any}
      - {pattern: os.spawnv, arg: any}
      - {pattern: os.spawnvp, arg: any}
      - {pattern: builtins.eval, arg: 0}
      - {pattern: builtins.exec, arg: 0}
      - {pattern: builtins.__import__, arg: 0}
      - {pattern: importlib.import_module, arg: 0}
    sanitizers:
      - patterns: [shlex.quote, pipes.quote, builtins.int, builtins.float, builtins.bool, uuid.UUID]

  - id: py.path-traversal
    severity: high
    cwe: CWE-22
    message: "Untrusted input is used as a filesystem path"
    kind: taint
    precision: high
    help: >-
      Reduce user input to a bare file name with werkzeug.utils.secure_filename() or
      os.path.basename(), or serve files with flask.send_from_directory().
      Note: realpath(...).startswith(BASE) guards are not recognised by this rule.
    sources:
      - {patterns: *flask_getters, when: *not_converted}
      - patterns: *flask_request
      - patterns: *framework_requests
      - patterns: *cli_input
    typed_parameters: *framework_parameters
    sinks:
      - {pattern: builtins.open, arg: 0, kwarg: file}
      - {pattern: io.open, arg: 0, kwarg: file}
      - {pattern: codecs.open, arg: 0, kwarg: filename}
      - {pattern: os.open, arg: 0, kwarg: path}
      - {pattern: pathlib.Path, arg: 0}
      - {pattern: "*.read_text", arg: receiver}
      - {pattern: "*.read_bytes", arg: receiver}
      - {pattern: "*.write_text", arg: receiver}
      - {pattern: "*.write_bytes", arg: receiver}
      - {pattern: os.remove, arg: any}
      - {pattern: os.unlink, arg: any}
      - {pattern: os.rmdir, arg: any}
      - {pattern: os.removedirs, arg: any}
      - {pattern: os.rename, arg: any}
      - {pattern: os.makedirs, arg: 0, kwarg: name}
      - {pattern: os.mkdir, arg: 0, kwarg: path}
      - {pattern: os.listdir, arg: 0, kwarg: path}
      - {pattern: shutil.rmtree, arg: any}
      - {pattern: shutil.copy, arg: any}
      - {pattern: shutil.copy2, arg: any}
      - {pattern: shutil.copyfile, arg: any}
      - {pattern: shutil.move, arg: any}
      - {pattern: flask.send_file, arg: 0, kwarg: path_or_file}
      - {pattern: tarfile.open, arg: 0, kwarg: name}
      - {pattern: zipfile.ZipFile, arg: 0, kwarg: file}
      - {pattern: django.http.FileResponse, arg: 0}
    sanitizers:
      - patterns: [werkzeug.utils.secure_filename, werkzeug.secure_filename, os.path.basename,
                   builtins.int, uuid.UUID]

  - id: py.ssrf
    severity: high
    cwe: CWE-918
    message: "Untrusted input controls the URL of a server-side request"
    kind: taint
    precision: high
    help: >-
      Do not let users choose the host of outbound requests. Map user input to an
      allowlisted set of URLs, or validate the parsed host against an allowlist.
    sources:
      - {patterns: *flask_getters, when: *not_converted}
      - patterns: *flask_request
      - patterns: *framework_requests
    typed_parameters: *framework_parameters
    sinks:
      - {pattern: requests.get, arg: 0, kwarg: url}
      - {pattern: requests.post, arg: 0, kwarg: url}
      - {pattern: requests.put, arg: 0, kwarg: url}
      - {pattern: requests.delete, arg: 0, kwarg: url}
      - {pattern: requests.patch, arg: 0, kwarg: url}
      - {pattern: requests.head, arg: 0, kwarg: url}
      - {pattern: requests.options, arg: 0, kwarg: url}
      - {pattern: requests.request, arg: 1, kwarg: url}
      - {pattern: urllib.request.urlopen, arg: 0, kwarg: url}
      - {pattern: urllib.request.Request, arg: 0, kwarg: url}
      - {pattern: httpx.get, arg: 0, kwarg: url}
      - {pattern: httpx.post, arg: 0, kwarg: url}
      - {pattern: httpx.put, arg: 0, kwarg: url}
      - {pattern: httpx.delete, arg: 0, kwarg: url}
      - {pattern: httpx.patch, arg: 0, kwarg: url}
      - {pattern: httpx.head, arg: 0, kwarg: url}
      - {pattern: httpx.options, arg: 0, kwarg: url}
      - {pattern: httpx.stream, arg: 1, kwarg: url}
      - {pattern: httpx.request, arg: 1, kwarg: url}
      - {pattern: http.client.HTTPConnection, arg: 0, kwarg: host}
      - {pattern: http.client.HTTPSConnection, arg: 0, kwarg: host}
      # methods on objects returned by library constructors: requests.Session().get(url)
      - {pattern: requests.Session.get, arg: 0, kwarg: url}
      - {pattern: requests.Session.post, arg: 0, kwarg: url}
      - {pattern: requests.Session.put, arg: 0, kwarg: url}
      - {pattern: requests.Session.delete, arg: 0, kwarg: url}
      - {pattern: requests.Session.patch, arg: 0, kwarg: url}
      - {pattern: requests.Session.head, arg: 0, kwarg: url}
      - {pattern: requests.Session.options, arg: 0, kwarg: url}
      - {pattern: requests.Session.request, arg: 1, kwarg: url}
      - {pattern: httpx.Client.get, arg: 0, kwarg: url}
      - {pattern: httpx.Client.post, arg: 0, kwarg: url}
      - {pattern: httpx.Client.put, arg: 0, kwarg: url}
      - {pattern: httpx.Client.delete, arg: 0, kwarg: url}
      - {pattern: httpx.Client.patch, arg: 0, kwarg: url}
      - {pattern: httpx.Client.head, arg: 0, kwarg: url}
      - {pattern: httpx.Client.options, arg: 0, kwarg: url}
      - {pattern: httpx.Client.request, arg: 1, kwarg: url}
      - {pattern: httpx.AsyncClient.get, arg: 0, kwarg: url}
      - {pattern: httpx.AsyncClient.post, arg: 0, kwarg: url}
      - {pattern: httpx.AsyncClient.put, arg: 0, kwarg: url}
      - {pattern: httpx.AsyncClient.delete, arg: 0, kwarg: url}
      - {pattern: httpx.AsyncClient.patch, arg: 0, kwarg: url}
      - {pattern: httpx.AsyncClient.head, arg: 0, kwarg: url}
      - {pattern: httpx.AsyncClient.options, arg: 0, kwarg: url}
      - {pattern: httpx.AsyncClient.request, arg: 1, kwarg: url}
      - {pattern: aiohttp.ClientSession.get, arg: 0, kwarg: url}
      - {pattern: aiohttp.ClientSession.post, arg: 0, kwarg: url}
      - {pattern: aiohttp.ClientSession.put, arg: 0, kwarg: url}
      - {pattern: aiohttp.ClientSession.delete, arg: 0, kwarg: url}
      - {pattern: aiohttp.ClientSession.patch, arg: 0, kwarg: url}
      - {pattern: aiohttp.ClientSession.head, arg: 0, kwarg: url}
      - {pattern: aiohttp.ClientSession.options, arg: 0, kwarg: url}
      - {pattern: aiohttp.ClientSession.request, arg: 1, kwarg: url}
      - {pattern: urllib3.PoolManager.request, arg: 1, kwarg: url}
    sanitizers: []
    # A URL whose scheme and host are fixed constants ("https://api.example.com/"
    # + user data) cannot be redirected to another host by what follows.
    safe_prefixes: ["http://*/*", "https://*/*"]

  - id: py.xss-template
    severity: high
    cwe: CWE-79
    message: "Untrusted input is rendered as a template or trusted markup"
    kind: taint
    precision: high
    help: >-
      Render user data through a template file with autoescaping
      (render_template("page.html", name=name)), or escape it with markupsafe.escape().
    sources:
      - {patterns: *flask_getters, when: *not_converted}
      - patterns: *flask_request
      - patterns: *framework_requests
    typed_parameters: *framework_parameters
    sinks:
      - {pattern: flask.render_template_string, arg: 0, kwarg: source}
      - {pattern: markupsafe.Markup, arg: 0}
      - {pattern: flask.Markup, arg: 0}
      - {pattern: jinja2.Markup, arg: 0}
      - {pattern: jinja2.Template, arg: 0, kwarg: source}
      - {pattern: jinja2.Environment.from_string, arg: 0, kwarg: source}
      - {pattern: jinja2.environment.Environment.from_string, arg: 0, kwarg: source}
      - {pattern: django.utils.safestring.mark_safe, arg: 0}
      - {pattern: django.utils.html.format_html, arg: 0}
      - {pattern: django.template.Template, arg: 0}
    sanitizers:
      - patterns: [markupsafe.escape, markupsafe.Markup.escape, flask.escape, jinja2.escape,
                   html.escape, bleach.clean, django.utils.html.escape, builtins.int]

  - id: py.insecure-deserialization
    severity: critical
    cwe: CWE-502
    message: "Untrusted input is deserialized with an unsafe loader"
    kind: taint
    precision: high
    help: >-
      Never unpickle data from users. Use json, or yaml.safe_load() /
      yaml.load(data, Loader=yaml.SafeLoader) for YAML.
    sources:
      - {patterns: *flask_getters, when: *not_converted}
      - patterns: *flask_request
      - patterns: *framework_requests
      - patterns: *cli_input
    typed_parameters: *framework_parameters
    sinks:
      - {pattern: pickle.loads, arg: 0, kwarg: data}
      - {pattern: pickle.load, arg: 0, kwarg: file}
      - {pattern: pickle.Unpickler, arg: 0, kwarg: file}
      - {pattern: _pickle.loads, arg: 0}
      - {pattern: cPickle.loads, arg: 0}
      - {pattern: cPickle.load, arg: 0}
      - {pattern: dill.loads, arg: 0}
      - {pattern: dill.load, arg: 0}
      - {pattern: marshal.loads, arg: 0}
      - {pattern: marshal.load, arg: 0}
      - {pattern: shelve.open, arg: 0, kwarg: filename}
      - {pattern: jsonpickle.decode, arg: 0, kwarg: string}
      - {pattern: pandas.read_pickle, arg: 0}
      - {pattern: joblib.load, arg: 0}
      - {pattern: torch.load, arg: 0, kwarg: f}
      - {pattern: yaml.unsafe_load, arg: 0, kwarg: stream}
      - {pattern: yaml.unsafe_load_all, arg: 0, kwarg: stream}
      - {pattern: yaml.full_load, arg: 0, kwarg: stream}
      - {pattern: yaml.full_load_all, arg: 0, kwarg: stream}
      - pattern: yaml.load
        arg: 0
        kwarg: stream
        when: &unsafe_loader {kwarg: Loader, pos: 1, not_in: [yaml.SafeLoader, yaml.CSafeLoader, yaml.BaseLoader, yaml.CBaseLoader]}
      - {pattern: yaml.load_all, arg: 0, kwarg: stream, when: *unsafe_loader}

  - id: py.hardcoded-secret
    severity: high
    cwe: CWE-798
    message: "Hard-coded credential"
    kind: pattern
    precision: medium
    help: >-
      Load credentials at runtime from the environment or a secret manager
      (os.environ["API_KEY"], a vault client...) instead of committing them.
    match:
      assigned_to: ["*_key", "*_secret", "*secret*", "*password*", "*passwd*", "*_pwd", "*token*", "apikey", "*_apikey"]
      value: literal_string
      min_entropy: 3.5
      min_length: 8
      # Names that match the globs above but hold something other than a secret.
      ignore_names: ["*_url", "*_uri", "*_endpoint", "*_field", "*_name", "*_path", "*_file",
                     "*_dir", "*_header", "*_env", "*_env_var", "*_var", "*_type", "*_label",
                     "*_prompt", "*_msg", "*_message", "*_help", "*_text", "*_error", "*_pattern",
                     "*_regex", "*_format", "*_template", "*_prefix", "*_suffix", "*_length",
                     "*_len", "*_param", "*_column", "*_attr", "*_class"]
      # Placeholders and prose. Globs are matched case-insensitively against the value;
      # "* *" skips any value containing a space (sentences, "Bearer <x>" templates).
      ignore_values: ["changeme", "change_me", "change-me", "changeit", "your*", "*_here", "*-here",
                      "<*>", "{*}", "${*}", "%(*", "xxx*", "[*][*][*]*", "todo*", "fixme*", "tbd",
                      "example", "example-*", "dummy*", "fake*", "test", "testing", "test-*",
                      "placeholder*", "replace*", "insert*", "secret", "password", "none",
                      "null", "redacted", "* *"]
      # Unmistakable credentials, reported wherever they appear (any variable name,
      # positional arguments...). `?` runs require a realistic length so that
      # prefix checks like token.startswith("ghp_") are not reported.
      force_values: ["-----begin*private key-----?*?-----end*",
                     "sk_live_????????????????*", "rk_live_????????????????*",
                     "ghp_????????????????????*", "gho_????????????????????*",
                     "ghs_????????????????????*", "ghu_????????????????????*",
                     "github_pat_????????????????????*", "glpat-????????????????????*",
                     "xoxb-??????????*", "xoxp-??????????*", "xoxa-??????????*"]
